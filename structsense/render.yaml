services:
  - type: web
    name: structsense
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: the sensor simulator runs as a background thread inside it.
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEVICE_KEY
        generateValue: true
